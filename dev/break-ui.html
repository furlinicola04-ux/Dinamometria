<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinamometria · prova dati</title>
<meta name="robots" content="noindex">
<style>
/* Strumento di sviluppo: non fa parte dell'app e non è nel service worker */
html,body{margin:0;height:100%;background:#f2f3f5}
iframe{display:block;border:0;width:100%;height:100%}
.dev{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;
  display:flex;gap:2px;padding:2px;border-radius:10px;background:#d9dbe0;font:500 13px/1 -apple-system,system-ui,sans-serif;
  box-shadow:0 2px 10px rgba(0,0,0,.18);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.dev button{font:inherit;border:0;background:none;color:#1c1d20;height:32px;padding:0 10px;border-radius:8px;white-space:nowrap;cursor:pointer}
.dev button[aria-pressed="true"]{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.busy[hidden]{display:none}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(242,243,245,.7);font:500 15px -apple-system,system-ui,sans-serif;color:#555}
</style>
</head>
<body>
<iframe id="app" title="Dinamometria"></iframe>
<div class="dev" role="group" aria-label="Dati di prova" id="dev"></div>
<div class="busy" id="busy" hidden>Carico i dati…</div>
<script src="fixtures.js"></script>
<script>
(function(){
"use strict";
const frame = document.getElementById("app"), bar = document.getElementById("dev"), busy = document.getElementById("busy");
const pick = () => { const k = new URLSearchParams(location.search).get("data"); return FIXTURES[k] ? k : "demo"; };

async function fill(key){
  const f = FIXTURES[key], w = frame.contentWindow, doc = frame.contentDocument;
  const $ = s => doc.querySelector(s);
  const set = (el, v) => { el.value = v; el.dispatchEvent(new w.Event("input", {bubbles:true})); };
  const tick = () => new Promise(r=>setTimeout(r,0));
  if(f.weight) set($("#weight"), f.weight);
  if(f.sex==="F") $("#sexF").click();
  for(const [id, x] of Object.entries(f.d || {})){
    $("#tab-"+id).click(); await tick();
    if(x.side) { const r = $(x.side==="sx" ? "#sideSx" : "#sideDx"); if(!r.checked) r.click(); }
    if(x.v){ x.v.forEach((v,i)=> v!=="" && set($(`#${id}-v-${i}`), v)); if(x.base) set($(`#${id}-base`), x.base); continue; }
    (x.l||[]).forEach((v,i)=> v!=="" && set($(`#${id}-l-${i}`), v));
    (x.s||[]).forEach((v,i)=> v!=="" && set($(`#${id}-s-${i}`), v));
    if(x.lpain) set($(`#${id}-lpain`), x.lpain);
    if(x.lp) set($(`#${id}-lp`), x.lp);
    if(x.sp) set($(`#${id}-sp`), x.sp);
  }
  const first = Object.keys(f.d || {})[0]; if(first) $("#tab-"+first).click();
  if(f.name) $("#athName").value = f.name;
  if(f.note) $("#athNote").value = f.note;
  doc.documentElement.dataset.fixture = key;
}

function show(key){
  history.replaceState(null, "", "?data=" + key);
  bar.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.k===key)));
  busy.hidden = false;
  frame.onload = async ()=>{ try{ await fill(key); } finally { busy.hidden = true; } };
  frame.src = "../index.html?fixture=" + key;
}
FIXTURE_ORDER.forEach(k=>{
  const b = document.createElement("button"); b.type = "button"; b.dataset.k = k; b.textContent = FIXTURES[k].label;
  b.addEventListener("click", ()=>show(k)); bar.appendChild(b);
});
show(pick());
})();
</script>
</body>
</html>
